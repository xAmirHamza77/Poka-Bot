name: Build Poka desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'poka-v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
        working-directory: client
      - run: npm install
        working-directory: desktop
      - run: python -m pip install -r server/requirements.txt pyinstaller
      - run: python -m unittest discover -s server/tests
        env:
          PYTHONPATH: server
      - run: npm test
        working-directory: desktop
      - run: npm run dist:${{ matrix.platform }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Poka-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true

